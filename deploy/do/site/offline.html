<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentHub — offline</title>
<style>
  :root { color-scheme: dark; }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: 24px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, 'Helvetica Neue', sans-serif;
    background: #0d0f12;
    color: #e6e8eb;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 20px;
    font-weight: 600;
  }

  p {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: #e6e8eb;
  }

  #status-line {
    margin: 20px 0 0;
    font-size: 13px;
    color: #8b939e;
  }
</style>
</head>
<body>
<main>
  <h1>AgentHub is offline</h1>
  <p>The hub isn't answering right now. Nothing is lost — this page is the edge; the hub keeps every project on its own disk.</p>
  <p id="status-line">Checking again in 15 s…</p>
</main>
<script>
(function () {
  var line = document.getElementById('status-line');

  function pad(n) {
    return n < 10 ? '0' + n : String(n);
  }

  function timeNow() {
    var d = new Date();
    return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function check() {
    fetch('/api/health', { cache: 'no-store' })
      .then(function (res) {
        if (res.ok) {
          line.textContent = 'Back — reloading…';
          location.reload();
        } else {
          line.textContent = 'Last checked ' + timeNow() + ' · still offline';
        }
      })
      .catch(function () {
        line.textContent = 'Last checked ' + timeNow() + ' · still offline';
      });
  }

  setInterval(check, 15000);
})();
</script>
</body>
</html>
