# MacBook M4 Pro: ephemeral worker tier (see deploy/macbook/README.md).
node:
  name: macbook
  arch: arm64
# The tailnet alias for whichever machine is currently the control node — not a
# machine name, so a /controlnode switch needs no config change here
# (deploy/do/README.md §6, deploy/controlnode.md).
hub: http://hub.internal:4000
# Backstop for the window before the alias has moved: probed in order after
# three consecutive failed heartbeats.
hubCandidates:
  - http://macmini.<tailnet>.ts.net:4000
  - http://strix.<tailnet>.ts.net:4000
advertiseHost: macbook.<tailnet>.ts.net
heartbeatMs: 5000
serving:
  - tier: worker
    # Qwen3.6-27B GGUF, Q4_K_M quant
    model: Qwen3.6-27B-GGUF
    port: 8001
    maxStreams: 2
    cmd: ["./launch-worker.sh"]
jobTypes: ["shell-task"]
workspaceRoot: /Users/<you>/agenthub-workspace
claimIntervalMs: 1000
