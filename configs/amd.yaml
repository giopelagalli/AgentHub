# AMD 7900XTX box: worker tier only (see deploy/amd/README.md).
node:
  name: amd
  arch: x64
# The hub lives on the Spark (docs/plan-jd-web-agenthub.md, decision 1).
hub: http://spark-f9a9:4000
# This box's own tailnet name: the hub routes agent traffic straight to it.
advertiseHost: <amd-tailnet-name>
heartbeatMs: 5000
serving:
  - tier: worker
    # unsloth/Qwen3.6-35B-A3B-GGUF, UD-Q4_K_XL quant (~23GB, ~65 tok/s)
    model: unsloth/Qwen3.6-35B-A3B-GGUF
    port: 8001
    maxStreams: 4
    # deploy/amd/launch-worker.sh, copied next to this file
    cmd: ["./launch-worker.sh"]
jobTypes: ["shell-task"]
workspaceRoot: /home/<you>/agenthub-workspace
claimIntervalMs: 1000
